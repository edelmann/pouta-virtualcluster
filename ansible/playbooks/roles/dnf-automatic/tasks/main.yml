--- 
- name: Install dnf-automatic
  become: yes
  yum:
    state: installed
    name: dnf-automatic

- name: Set upgrade_type
  become: yes
  community.general.ini_file:
    path: /etc/dnf/automatic.conf
    section: commands
    option: upgrade_type
    value: security

- name: Set download_updates
  become: yes
  community.general.ini_file:
    path: /etc/dnf/automatic.conf
    section: commands
    option: download_updates
    value: yes

- name: Set apply_updates
  become: yes
  community.general.ini_file:
    path: /etc/dnf/automatic.conf
    section: commands
    option: apply_updates
    value: yes

- name: Set reboot to "never"
  become: yes
  community.general.ini_file:
    path: /etc/dnf/automatic.conf
    section: commands
    option: reboot
    value: never

- name: Set emit_via
  become: yes
  community.general.ini_file:
    path: /etc/dnf/automatic.conf
    section: emitters
    option: emit_via
    value: motd

- name: enable dnf-automatic.timer
  become: yes
  service:
    name: dnf-automatic.timer
    enabled: yes
    state: started
